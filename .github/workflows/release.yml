name: Release

# 推一个 v 开头的 tag 就自动：构建 → 生成更新清单 → 发 Release（带 exe 和 version.json）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 构建单文件 exe
        run: |
          # 版本号必须用 tag，否则 exe 内部版本和 tag 对不上：
          # 程序会认为「线上比自己新」→ 反复提示更新，装了也停不下来。
          $ver = "${{ github.ref_name }}".TrimStart('v')

          dotnet publish ClassManager.App/ClassManager.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishReadyToRun=false `
            -p:DebugType=none `
            -p:SatelliteResourceLanguages=zh-Hans `
            -p:Version=$ver `
            -o publish

      - name: 生成更新清单 version.json
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ github.ref_name }}".TrimStart('v')
          $repo = "${{ github.repository }}"
          $exe = 'publish/ClassManager.App.exe'
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $exe).Length
          $url = "https://github.com/$repo/releases/download/${{ github.ref_name }}/ClassManager.App.exe"

          # 国内直连 GitHub 慢（实测 14KB/s），这两个加速前缀实测 369–516KB/s
          $mirrors = @(
            "https://api.gitproxy.dev/$url",
            "https://ghfast.top/$url"
          )

          $manifest = [ordered]@{
            version   = $version
            url       = $url
            size      = $size
            sha256    = $sha
            notes     = "${{ github.event.head_commit.message }}"
            publishedAt = (Get-Date -Format 'yyyy-MM-dd')
            mirrors   = $mirrors
            page      = "https://github.com/$repo/releases/latest"
          }

          $json = $manifest | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText('version.json', $json, (New-Object System.Text.UTF8Encoding($false)))

          New-Item -ItemType Directory -Force -Path 'docs' | Out-Null
          Copy-Item 'version.json' 'docs/version.json' -Force

      - name: 创建 Release（附 exe 与清单）
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/ClassManager.App.exe
            version.json
          body: |
            由 GitHub Actions 自动构建。

            下载慢的话，把地址前面的 `https://github.com` 换成
            `https://api.gitproxy.dev/https://github.com` 会快很多。

      - name: 把清单提交回仓库（方便 jsDelivr 直接读）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'docs/version.json'

          # 注意：必须用 $LASTEXITCODE 判断有无改动。
          # PowerShell 里 `(git diff --quiet)` 捕获的是输出数组，exit code 会丢失，
          # 写成 `if (-not (git diff --staged --quiet))` 会恒为真，
          # 无改动时也会去 commit → 报「nothing to commit」→ 整个步骤失败。
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: 更新更新清单 ${{ github.ref_name }}"

            # 必须显式指定目标分支：tag 触发时 checkout 处于 detached HEAD，
            # 直接 `git push` 会报「You are not currently on a branch.」
            git push origin HEAD:main
          } else {
            Write-Host '清单无变化，跳过提交'
          }
